[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "support-rag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.7,<3", "langchain-core>=0.3,<2", "langchain-deepseek>=0.1,<2", "rank-bm25==0.2.2", "jieba==0.42.1", "numpy>=1.26,<3", "tiktoken>=0.9,<1"]
[project.optional-dependencies]
models = ["sentence-transformers>=4,<6"]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
