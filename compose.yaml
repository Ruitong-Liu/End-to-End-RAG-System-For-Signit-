services:
  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      CORPUS_DIR: /data
      INDEX_DIR: /index
    volumes:
      - ${RAG_CORPUS_PATH:-./data/demo}:/data:ro
      - rag_index:/index
      - rag_models:/models
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  rag_index:
  rag_models:
